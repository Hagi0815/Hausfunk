<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sonnenspiel – Zuordnen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top:#BEE3F8;
    --sky-bottom:#EAF7ED;
    --sun-body:#FFC93C;
    --sun-cheek:#FF9F6B;
    --tile-bg:#FFFFFF;
    --tile-shadow:rgba(46,58,70,0.18);
    --ring:#6BCB77;
    --ink:#2E3A46;
    --panel-bg:#FFFDF7;
    --panel-shadow:rgba(46,58,70,0.25);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    height:100%; height:100dvh;
    margin:0; overflow:hidden; touch-action:manipulation;
  }
  body {
    font-family:'Nunito', system-ui, sans-serif;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    user-select:none;
  }

  #mascot { position:fixed; top:14px; left:14px; width:72px; height:72px; z-index:5; }
  #mascot.bounce { animation: bounce .5s ease; }
  #mascot.win { animation: spinBounce 1.1s ease; }
  @keyframes bounce { 0%{transform:scale(1)} 30%{transform:scale(1.25) rotate(-8deg)} 60%{transform:scale(0.95) rotate(6deg)} 100%{transform:scale(1)} }
  @keyframes spinBounce { 0%{transform:scale(1) rotate(0)} 50%{transform:scale(1.4) rotate(180deg)} 100%{transform:scale(1) rotate(360deg)} }

  #fullscreenBtn {
    position:fixed; top:14px; right:14px; width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,0.7); border:none; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 4px 10px var(--tile-shadow); z-index:20; padding:0;
  }
  #fullscreenBtn.hidden { display:none; }
  #fullscreenBtn:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
  #fullscreenBtn svg { width:26px; height:26px; }

  #board {
    display:grid;
    gap:clamp(10px, 2vw, 22px);
    padding:20px;
    justify-content:center;
    align-content:center;
  }
  .tile {
    width:var(--tile-size, clamp(64px, 16vw, 140px));
    height:var(--tile-size, clamp(64px, 16vw, 140px));
    background:var(--tile-bg);
    border-radius:22px;
    box-shadow:0 6px 0 var(--tile-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--tile-size, clamp(64px, 16vw, 140px)) * 0.45);
    cursor:pointer;
    border:4px solid transparent;
    transition:transform .15s ease, opacity .3s ease, border-color .15s ease;
  }
  .tile:focus-visible { outline:none; border-color:var(--ring); }
  .tile.selected { border-color:var(--ring); transform:translateY(-4px); }
  .tile.matched { opacity:0; transform:scale(0.4); pointer-events:none; }
  .tile.wrong { animation:wiggle .4s ease; }
  @keyframes wiggle { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .swatch { width:70%; height:70%; border-radius:50%; box-shadow:inset 0 -6px 10px rgba(0,0,0,0.15), 0 3px 0 rgba(0,0,0,0.08); }

  #settingsOverlay {
    position:fixed; inset:0; background:rgba(46,58,70,0.35);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:30;
  }
  #settingsOverlay.open { opacity:1; pointer-events:auto; }
  #settingsPanel {
    background:var(--panel-bg); border-radius:28px; padding:28px;
    width:min(420px, 88vw); box-shadow:0 20px 40px var(--panel-shadow);
    font-family:'Fredoka', sans-serif; color:var(--ink);
  }
  #settingsPanel h2 { margin:0 0 18px; font-size:22px; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .row.hidden { display:none; }
  .tap-tile {
    width:var(--tile-size, clamp(64px, 16vw, 140px));
    height:var(--tile-size, clamp(64px, 16vw, 140px));
    background:var(--tile-bg);
    border-radius:26px;
    box-shadow:0 6px 0 var(--tile-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--tile-size, clamp(64px, 16vw, 140px)) * 0.45);
    cursor:pointer;
    border:4px solid transparent;
    transition:transform .1s ease;
  }
  .tap-tile:active { transform:scale(0.92); }
  .tap-tile.pop { animation:tapPop .4s ease; }
  @keyframes tapPop { 0%{transform:scale(1)} 40%{transform:scale(1.18) rotate(-4deg)} 100%{transform:scale(1)} }
  .tap-tile .swatch { width:70%; height:70%; border-radius:50%; box-shadow:inset 0 -6px 10px rgba(0,0,0,0.15), 0 3px 0 rgba(0,0,0,0.08); }
  .row span.label { font-size:17px; }
  .stepper { display:flex; align-items:center; gap:10px; }
  .stepper button {
    width:44px; height:44px; border-radius:50%; border:none; background:var(--ring); color:white;
    font-size:22px; font-weight:700; cursor:pointer;
  }
  .stepper output { font-size:20px; min-width:28px; text-align:center; }
  .theme-btns, .toggle-btns { display:flex; gap:10px; flex-wrap:wrap; }
  .theme-btns button, .toggle-btns button {
    flex:1 1 26%; padding:10px 6px; border-radius:14px; border:3px solid transparent; background:white;
    font-size:22px; cursor:pointer;
  }
  .theme-btns button.active, .toggle-btns button.active { border-color:var(--ring); background:#EAF9EC; }
  .name-input {
    font-family:'Fredoka', sans-serif; font-size:17px; color:var(--ink);
    border:2px solid #DDE6DA; border-radius:12px; padding:8px 12px; width:140px;
    background:white; text-align:center;
  }
  .name-input:focus-visible { outline:3px solid var(--ring); outline-offset:1px; }
  .stats-box {
    background:white; border-radius:14px; padding:12px 14px; margin-bottom:14px;
    font-family:'Fredoka', sans-serif; color:var(--ink);
  }
  .stats-heading { font-size:15px; font-weight:700; margin-bottom:8px; }
  .stats-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; color:#5B6670; }
  .stats-row span:last-child { color:var(--ink); font-weight:600; }
  #statsResetBtn {
    margin-top:6px; width:100%; padding:7px; border:none; border-radius:10px;
    background:#F1EEE6; color:#8A8378; font-family:'Fredoka'; font-size:12px; cursor:pointer;
  }
  #startBtn {
    width:100%; padding:14px; margin-top:8px; border:none; border-radius:18px;
    background:var(--sun-body); font-family:'Fredoka'; font-weight:700; font-size:19px;
    color:var(--ink); cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,0.12);
  }

  #celebration {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:20px; z-index:40; background:rgba(255,255,255,0.55);
  }
  #celebration.show { display:flex; }
  #celebration button {
    width:84px; height:84px; border-radius:50%; border:none; background:var(--ring);
    color:white; font-size:36px; cursor:pointer; box-shadow:0 6px 0 rgba(0,0,0,0.15);
  }
  .confetti-piece {
    position:fixed; top:-20px; width:12px; height:18px; z-index:39; border-radius:3px;
    animation:fall linear forwards;
  }
  @keyframes fall { to { transform:translateY(110vh) rotate(360deg); opacity:0.9; } }

  @media (prefers-reduced-motion: reduce) {
    #mascot.bounce, #mascot.win, .tile.wrong { animation:none !important; }
    .tap-tile.pop { animation:none !important; }
    .confetti-piece { animation:none !important; display:none; }
  }
</style>
</head>
<body>

<svg id="mascot" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="34" fill="#FFC93C"/>
  <g stroke="#FFC93C" stroke-width="8" stroke-linecap="round">
    <line x1="50" y1="4" x2="50" y2="14"/>
    <line x1="50" y1="86" x2="50" y2="96"/>
    <line x1="4" y1="50" x2="14" y2="50"/>
    <line x1="86" y1="50" x2="96" y2="50"/>
    <line x1="16" y1="16" x2="23" y2="23"/>
    <line x1="77" y1="77" x2="84" y2="84"/>
    <line x1="16" y1="84" x2="23" y2="77"/>
    <line x1="77" y1="23" x2="84" y2="16"/>
  </g>
  <circle cx="38" cy="46" r="5" fill="#2E3A46"/>
  <circle cx="62" cy="46" r="5" fill="#2E3A46"/>
  <circle cx="34" cy="58" r="6" fill="#FF9F6B" opacity="0.6"/>
  <circle cx="66" cy="58" r="6" fill="#FF9F6B" opacity="0.6"/>
  <path id="mouthNormal" d="M40 62 Q50 68 60 62" stroke="#2E3A46" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path id="mouthExcited" d="M36 60 Q50 78 64 60 Q50 74 36 60 Z" fill="#2E3A46" style="display:none"/>
</svg>
<button id="fullscreenBtn" aria-label="Vollbild an">
  <svg viewBox="0 0 24 24" fill="none" stroke="#2E3A46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9V5a1 1 0 0 1 1-1h4"/>
    <path d="M20 9V5a1 1 0 0 0-1-1h-4"/>
    <path d="M4 15v4a1 1 0 0 0 1 1h4"/>
    <path d="M20 15v4a1 1 0 0 1-1 1h-4"/>
  </svg>
</button>

<div id="board" role="group" aria-label="Spielfeld"></div>

<div id="settingsOverlay">
  <div id="settingsPanel">
    <h2>Einstellungen</h2>
    <div class="row" style="flex-direction:column; align-items:stretch; gap:10px;">
      <span class="label">Spielmodus</span>
      <div class="theme-btns" id="modeBtns">
        <button data-mode="match" class="active">🧩 Zuordnen</button>
        <button data-mode="tap">👆 Tippen</button>
      </div>
    </div>
    <div class="row" id="pairsRow">
      <span class="label">Anzahl der Paare</span>
      <div class="stepper">
        <button id="pairsMinus" aria-label="Weniger Paare">–</button>
        <output id="pairsValue">3</output>
        <button id="pairsPlus" aria-label="Mehr Paare">+</button>
      </div>
    </div>
    <div class="row" style="flex-direction:column; align-items:stretch; gap:10px;">
      <span class="label">Motiv</span>
      <div class="theme-btns" id="themeBtnsRow">
        <button data-theme="colors" class="active">🔴</button>
        <button data-theme="animals">🐶</button>
        <button data-theme="fruits">🍎</button>
        <button data-theme="vehicles">🚗</button>
        <button data-theme="numbers">🔢</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Name</span>
      <input id="nameInput" type="text" value="Mausi" maxlength="20" class="name-input">
    </div>
    <div class="row">
      <span class="label">Ton</span>
      <div class="toggle-btns">
        <button data-sound="on" class="active">🔊</button>
        <button data-sound="off">🔇</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Stimme</span>
      <div class="toggle-btns" id="voiceBtns">
        <button data-voice="on" class="active">🗣️</button>
        <button data-voice="off">🤫</button>
      </div>
    </div>
    <div class="row">
      <span class="label">Motiv nach Sieg</span>
      <div class="toggle-btns" id="autoSwitchBtns">
        <button data-autoswitch="on" class="active" title="Wechselt automatisch zu einem anderen Motiv">🔀</button>
        <button data-autoswitch="off" title="Bleibt beim gewählten Motiv">📌</button>
      </div>
    </div>
    <div class="stats-box">
      <div class="stats-heading">📊 Statistik</div>
      <div class="stats-row"><span>Diese Runde</span><span id="statsSession">0 Erfolge · 0 Fehler</span></div>
      <div class="stats-row"><span>Insgesamt</span><span id="statsTotal">0 Erfolge · 0 Fehler · 0 Spiele</span></div>
      <button id="statsResetBtn" type="button">Statistik zurücksetzen</button>
    </div>
    <button id="startBtn">Spiel starten</button>
  </div>
</div>

<div id="celebration">
  <div id="celebrationMsg" style="font-family:'Fredoka'; font-size:26px; color:#2E3A46;">Super gemacht! 🎉</div>
  <button id="playAgainBtn" aria-label="Nochmal spielen">🔁</button>
</div>

<script>
(function(){
  const THEMES = {
    colors: { kind:'color', values:['#FF6B6B','#4D96FF','#6BCB77','#FFD93D','#B983FF','#FF9F45','#FF8FAB','#38C9C9','#A0724D','#78909C'] },
    animals: { kind:'emoji', values:['🐶','🐱','🐰','🦁','🐸','🐻','🐵','🐹','🐷','🐮','🐔','🐧','🦋','🐢','🐳','🦒'] },
    fruits: { kind:'emoji', values:['🍎','🍌','🍇','🍓','🍉','🍊','🍒','🍑','🍍','🥝','🍋','🍐','🥭','🍈'] },
    vehicles: { kind:'emoji', values:['🚗','🚌','🚑','🚒','🚜','🚲','🏍️','✈️','🚀','🚁','🚂','🚢','⛵','🛴'] },
    numbers: { kind:'emoji', values:['1️⃣','2️⃣','3️⃣','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣','9️⃣','🔟'] }
  };
  const COLS_LOOKUP = {4:2,6:3,8:4,10:5,12:4,14:5,16:4};

  // Zufaellig N verschiedene Symbole aus dem Motiv-Vorrat auswaehlen (statt
  // immer dieselben ersten N) -- damit bei jedem neuen Spiel (auch nach einem
  // Sieg) andere Symbole drankommen und es nicht langweilig wird.
  function pickRandomSymbols(values, count){
    const pool = values.slice();
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    return pool.slice(0, count);
  }

  const THEME_KEYS = Object.keys(THEMES);
  function pickDifferentTheme(currentTheme){
    const others = THEME_KEYS.filter(function(k){ return k !== currentTheme; });
    return others[Math.floor(Math.random()*others.length)];
  }

  // Statistik: Erfolge/Fehler laufen im Hintergrund mit, unsichtbar fuers Kind
  // (nur in den versteckten Einstellungen sichtbar, fuer Eltern/Betreuer).
  // "Insgesamt" bleibt geraeteweise ueber Neustarts hinweg erhalten,
  // "Diese Runde" zaehlt nur seit dem Oeffnen der Seite.
  const STATS_KEY = 'sonnenspiel-stats-total';
  function loadTotalStats(){
    try {
      const saved = JSON.parse(localStorage.getItem(STATS_KEY));
      if(saved && typeof saved === 'object'){
        return { matches: saved.matches||0, errors: saved.errors||0, games: saved.games||0 };
      }
    } catch(err) { /* ignorieren, mit leerem Stand weitermachen */ }
    return { matches:0, errors:0, games:0 };
  }
  const stats = {
    session: { matches:0, errors:0 },
    total: loadTotalStats(),
  };
  function saveTotalStats(){
    try { localStorage.setItem(STATS_KEY, JSON.stringify(stats.total)); } catch(err) { /* ignorieren */ }
  }
  function renderStats(){
    statsSessionEl.textContent = stats.session.matches + ' Erfolge · ' + stats.session.errors + ' Fehler';
    statsTotalEl.textContent = stats.total.matches + ' Erfolge · ' + stats.total.errors + ' Fehler · ' + stats.total.games + ' Spiele';
  }
  function recordMatch(){
    stats.session.matches += 1;
    stats.total.matches += 1;
    saveTotalStats();
    renderStats();
  }
  function recordError(){
    stats.session.errors += 1;
    stats.total.errors += 1;
    saveTotalStats();
    renderStats();
  }
  function recordGameCompleted(){
    stats.total.games += 1;
    saveTotalStats();
    renderStats();
  }

  const state = { mode:'match', pairs:3, theme:'colors', sound:true, voice:true, autoSwitchTheme:true, name:'Mausi', board:[], selected:[], matchedCount:0, lock:false };

  const boardEl = document.getElementById('board');
  const mascot = document.getElementById('mascot');
  const mouthNormal = document.getElementById('mouthNormal');
  const mouthExcited = document.getElementById('mouthExcited');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const pairsValue = document.getElementById('pairsValue');
  const pairsMinus = document.getElementById('pairsMinus');
  const pairsPlus = document.getElementById('pairsPlus');
  const startBtn = document.getElementById('startBtn');
  const celebration = document.getElementById('celebration');
  const playAgainBtn = document.getElementById('playAgainBtn');
  const nameInput = document.getElementById('nameInput');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const statsSessionEl = document.getElementById('statsSession');
  const statsTotalEl = document.getElementById('statsTotal');
  const statsResetBtn = document.getElementById('statsResetBtn');
  const pairsRow = document.getElementById('pairsRow');
  const modeBtns = document.querySelectorAll('#modeBtns button');

  let audioCtx = null;
  function ensureAudio(){ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } }
  function tone(freq, start, dur, gainVal, type){
    if(!state.sound) return;
    ensureAudio();
    gainVal = gainVal || 0.18; type = type || 'sine';
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, audioCtx.currentTime+start);
    gain.gain.linearRampToValueAtTime(gainVal, audioCtx.currentTime+start+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+start+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime+start);
    osc.stop(audioCtx.currentTime+start+dur+0.05);
  }
  function playMatch(){ tone(523.25,0,0.18); tone(659.25,0.12,0.18); tone(783.99,0.24,0.25); }
  function playSoft(){ tone(220,0,0.18,0.09,'sine'); }
  function playWin(){ tone(523.25,0,0.15); tone(659.25,0.15,0.15); tone(783.99,0.3,0.15); tone(1046.5,0.45,0.4); }

  // Sprachansagen - variieren bewusst, damit es sich nicht wiederholt/monoton anhört.
  const SUCCESS_PHRASES = [
    (n)=> n + ', super gemacht!',
    (n)=> 'Klasse gemacht, ' + n + '!',
    (n)=> n + ', das war spitze!',
    (n)=> 'Toll, das hast du geschafft!'
  ];
  const TRY_AGAIN_PHRASES = [
    (n)=> n + ', versuch es bitte noch einmal.',
    (n)=> 'Fast, ' + n + ', probier es noch mal.',
    (n)=> 'Nicht schlimm, ' + n + ', versuch es noch mal.'
  ];
  const WIN_PHRASES = [
    (n)=> n + ', du hast alle gefunden! Super gemacht!',
    (n)=> 'Wow ' + n + ', alle Paare gefunden!'
  ];

  let cachedVoices = [];
  function loadVoices(){ cachedVoices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
  if('speechSynthesis' in window){
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text){
    if(!state.voice) return;
    if(!('speechSynthesis' in window)) return;
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'de-DE';
    utter.rate = 0.95;
    utter.pitch = 1.05;
    const deVoice = cachedVoices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf('de') === 0; });
    if(deVoice) utter.voice = deVoice;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }
  function speakRandom(templates){
    const t = templates[Math.floor(Math.random()*templates.length)];
    speak(t(state.name || 'Mausi'));
  }

  // Kachelgroesse dynamisch an die tatsaechliche Bildschirmgroesse anpassen --
  // nicht nur an die Breite (wie zuvor per CSS clamp() allein), sondern auch
  // an die Hoehe, damit das Spielfeld bei vielen Paaren auf schmalen/hohen
  // Bildschirmen (z.B. Tablet im Hochformat) nicht abgeschnitten wird.
  function fitBoardToViewport(cols, rows){
    // window.visualViewport liefert auf Handys die tatsaechlich sichtbare
    // Flaeche zuverlaessiger als window.innerWidth/Height (die je nach
    // Browser die ein-/ausblendende Adressleiste falsch mit einrechnen).
    const vv = window.visualViewport;
    const viewportWidth = vv ? vv.width : window.innerWidth;
    const viewportHeight = vv ? vv.height : window.innerHeight;
    const gap = 16;
    const horizontalPadding = 40;
    const verticalReserve = 110; // Platz oben fuer Maskottchen/Vollbild-Button
    const availableWidth = viewportWidth - horizontalPadding;
    const availableHeight = viewportHeight - verticalReserve;
    const tileFromWidth = (availableWidth - gap*(cols-1)) / cols;
    const tileFromHeight = (availableHeight - gap*(rows-1)) / rows;
    const size = Math.max(40, Math.min(140, tileFromWidth, tileFromHeight));
    document.documentElement.style.setProperty('--tile-size', size + 'px');
  }
  function refitCurrentBoard(){
    if(state.currentCols && state.currentRows){
      fitBoardToViewport(state.currentCols, state.currentRows);
    }
  }
  window.addEventListener('resize', refitCurrentBoard);
  window.addEventListener('orientationchange', function(){
    // Nach einer Drehung braucht der Browser manchmal einen Moment, bis
    // innerWidth/Height bzw. visualViewport den neuen Wert melden.
    setTimeout(refitCurrentBoard, 50);
    setTimeout(refitCurrentBoard, 300);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', refitCurrentBoard);
  }

  function buildBoard(){
    const total = state.pairs*2;
    const theme = THEMES[state.theme];
    const symbols = pickRandomSymbols(theme.values, state.pairs);
    const deck = symbols.concat(symbols).map((v,i)=>({ id:i, value:v, matched:false }));
    for(let i=deck.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
    }
    state.board = deck;
    state.selected = [];
    state.matchedCount = 0;
    state.lock = false;
    const cols = COLS_LOOKUP[total] || Math.ceil(Math.sqrt(total));
    const rows = Math.ceil(total / cols);
    state.currentCols = cols;
    state.currentRows = rows;
    fitBoardToViewport(cols, rows);
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
    renderBoard();
    celebration.classList.remove('show');
  }

  // Zweiter, einfacherer Spielmodus: nur antippen, sofortige positive Reaktion
  // (Ton + Animation, gelegentlich Konfetti), kein Zuordnen, kein Sieg/Ende --
  // gedacht als niedrigschwellige Alternative fuer Ursache-Wirkung-Uebung.
  const TAP_SOUNDS = [
    function(){ tone(523.25,0,0.16); },
    function(){ tone(659.25,0,0.16); },
    function(){ tone(783.99,0,0.16); },
    function(){ tone(440,0,0.12); tone(554.37,0.1,0.16); },
    function(){ tone(349.23,0,0.16); },
    function(){ tone(880,0,0.14); }
  ];
  function handleTapTile(tile){
    tile.classList.remove('pop'); void tile.offsetWidth;
    tile.classList.add('pop');
    const playSound = TAP_SOUNDS[Math.floor(Math.random()*TAP_SOUNDS.length)];
    playSound();
    bounceMascot();
    if(Math.random() < 0.2){ spawnConfetti(); }
  }

  function buildTapMode(){
    const theme = THEMES[state.theme];
    const count = Math.min(theme.values.length, 9);
    const symbols = pickRandomSymbols(theme.values, count);
    const cols = Math.ceil(Math.sqrt(count));
    const rows = Math.ceil(count / cols);
    state.currentCols = cols;
    state.currentRows = rows;
    fitBoardToViewport(cols, rows);
    boardEl.style.gridTemplateColumns = 'repeat(' + cols + ', auto)';
    boardEl.innerHTML = '';
    symbols.forEach(function(value){
      const tile = document.createElement('div');
      tile.className = 'tap-tile';
      tile.tabIndex = 0;
      tile.setAttribute('role','button');
      if(theme.kind === 'color'){
        const sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.background = value;
        tile.appendChild(sw);
      } else {
        tile.textContent = value;
      }
      tile.addEventListener('click', function(){ handleTapTile(tile); });
      tile.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleTapTile(tile); } });
      boardEl.appendChild(tile);
    });
    celebration.classList.remove('show');
  }

  function startRound(){
    if(state.mode === 'tap'){
      buildTapMode();
    } else {
      buildBoard();
    }
  }

  function renderBoard(){
    boardEl.innerHTML = '';
    const theme = THEMES[state.theme];
    state.board.forEach((tileData, idx)=>{
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.tabIndex = 0;
      tile.setAttribute('role','button');
      tile.dataset.idx = idx;
      if(tileData.matched) tile.classList.add('matched');
      if(theme.kind === 'color'){
        const sw = document.createElement('div');
        sw.className = 'swatch';
        sw.style.background = tileData.value;
        tile.appendChild(sw);
      } else {
        tile.textContent = tileData.value;
      }
      tile.addEventListener('click', function(){ handleTileClick(idx); });
      tile.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); handleTileClick(idx); } });
      boardEl.appendChild(tile);
    });
  }

  function handleTileClick(idx){
    if(state.lock) return;
    const tileData = state.board[idx];
    if(tileData.matched) return;
    if(state.selected.indexOf(idx) !== -1) return;
    const tileEl = boardEl.children[idx];
    tileEl.classList.add('selected');
    state.selected.push(idx);
    if(state.selected.length === 2){
      state.lock = true;
      const a = state.selected[0], b = state.selected[1];
      const dataA = state.board[a], dataB = state.board[b];
      if(dataA.value === dataB.value){
        setTimeout(function(){
          dataA.matched = true; dataB.matched = true;
          boardEl.children[a].classList.add('matched');
          boardEl.children[b].classList.add('matched');
          boardEl.children[a].classList.remove('selected');
          boardEl.children[b].classList.remove('selected');
          state.matchedCount += 2;
          recordMatch();
          playMatch();
          bounceMascot();
          setTimeout(function(){ speakRandom(SUCCESS_PHRASES); }, 150);
          state.selected = [];
          state.lock = false;
          if(state.matchedCount === state.board.length){
            setTimeout(triggerWin, 400);
          }
        }, 280);
      } else {
        recordError();
        playSoft();
        setTimeout(function(){ speakRandom(TRY_AGAIN_PHRASES); }, 150);
        boardEl.children[a].classList.add('wrong');
        boardEl.children[b].classList.add('wrong');
        setTimeout(function(){
          boardEl.children[a].classList.remove('selected','wrong');
          boardEl.children[b].classList.remove('selected','wrong');
          state.selected = [];
          state.lock = false;
        }, 500);
      }
    }
  }

  function bounceMascot(){
    mascot.classList.remove('bounce'); void mascot.offsetWidth;
    mascot.classList.add('bounce');
  }

  function triggerWin(){
    mascot.classList.add('win');
    mouthNormal.style.display = 'none';
    mouthExcited.style.display = 'block';
    recordGameCompleted();
    playWin();
    celebration.classList.add('show');
    spawnConfetti();
    setTimeout(function(){ speakRandom(WIN_PHRASES); }, 300);
    setTimeout(function(){ mascot.classList.remove('win'); }, 1200);
  }

  function spawnConfetti(){
    const colors = ['#FF6B6B','#4D96FF','#6BCB77','#FFD93D','#B983FF','#FF9F45'];
    for(let i=0;i<40;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random()*100)+'vw';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2+Math.random()*1.5)+'s';
      piece.style.animationDelay = (Math.random()*0.4)+'s';
      document.body.appendChild(piece);
      setTimeout(function(){ piece.remove(); }, 4000);
    }
  }

  function isFullscreenActive(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  function updateFullscreenBtn(){
    fullscreenBtn.classList.toggle('hidden', isFullscreenActive());
  }
  function requestFullscreenSafe(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if(req && !isFullscreenActive()){
      try { req.call(el); } catch(err) { /* ignore - needs a user gesture on some browsers */ }
    }
  }
  ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(evt){
    document.addEventListener(evt, updateFullscreenBtn);
  });
  updateFullscreenBtn();
  fullscreenBtn.addEventListener('click', requestFullscreenSafe);

  // Vollbild lässt sich in den meisten Browsern nur nach einer Nutzerinteraktion aktivieren,
  // daher hier bei der ersten Berührung/Klick irgendwo auf der Seite auslösen.
  function firstInteractionHandler(){
    requestFullscreenSafe();
    document.removeEventListener('pointerdown', firstInteractionHandler);
    document.removeEventListener('keydown', firstInteractionHandler);
  }
  document.addEventListener('pointerdown', firstInteractionHandler);
  document.addEventListener('keydown', firstInteractionHandler);

  settingsOverlay.addEventListener('click', function(e){ if(e.target === settingsOverlay) settingsOverlay.classList.remove('open'); });

  // Menü ist bewusst nicht per Touch erreichbar - nur über Strg+Umschalt+E auf einer
  // physischen Tastatur (z.B. für Eltern/Betreuer), damit das Kind es nicht selbst öffnet.
  document.addEventListener('keydown', function(e){
    if(e.ctrlKey && e.shiftKey && (e.key === 'E' || e.key === 'e')){
      e.preventDefault();
      settingsOverlay.classList.toggle('open');
    } else if(e.key === 'Escape'){
      settingsOverlay.classList.remove('open');
    }
  });

  modeBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      modeBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.mode = btn.dataset.mode;
      pairsRow.classList.toggle('hidden', state.mode !== 'match');
    });
  });

  pairsMinus.addEventListener('click', function(){ state.pairs = Math.max(2, state.pairs-1); pairsValue.textContent = state.pairs; });
  pairsPlus.addEventListener('click', function(){ state.pairs = Math.min(8, state.pairs+1); pairsValue.textContent = state.pairs; });

  const themeBtns = document.querySelectorAll('#themeBtnsRow button');
  themeBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      themeBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.theme = btn.dataset.theme;
    });
  });
  const soundBtns = document.querySelectorAll('[data-sound]');
  soundBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      soundBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.sound = btn.dataset.sound === 'on';
    });
  });
  const voiceBtns = document.querySelectorAll('[data-voice]');
  voiceBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      voiceBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.voice = btn.dataset.voice === 'on';
    });
  });
  const autoSwitchBtns = document.querySelectorAll('[data-autoswitch]');
  autoSwitchBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      autoSwitchBtns.forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      state.autoSwitchTheme = btn.dataset.autoswitch === 'on';
    });
  });
  nameInput.addEventListener('input', function(){
    state.name = nameInput.value.trim() || 'Mausi';
  });

  startBtn.addEventListener('click', function(){
    settingsOverlay.classList.remove('open');
    mouthNormal.style.display='block'; mouthExcited.style.display='none';
    startRound();
  });

  playAgainBtn.addEventListener('click', function(){
    mouthNormal.style.display='block'; mouthExcited.style.display='none';
    if(state.autoSwitchTheme){
      state.theme = pickDifferentTheme(state.theme);
      // Die (versteckten) Einstellungen mit dem neuen Motiv synchron halten,
      // damit sie beim naechsten Oeffnen (Strg+Umschalt+E) den aktuellen Stand zeigen.
      themeBtns.forEach(function(b){ b.classList.toggle('active', b.dataset.theme === state.theme); });
    }
    buildBoard();
  });

  statsResetBtn.addEventListener('click', function(){
    if(!window.confirm('Statistik wirklich zuruecksetzen?')) return;
    stats.session.matches = 0; stats.session.errors = 0;
    stats.total.matches = 0; stats.total.errors = 0; stats.total.games = 0;
    saveTotalStats();
    renderStats();
  });

  renderStats();
  startRound();
})();
</script>
</body>
</html>
